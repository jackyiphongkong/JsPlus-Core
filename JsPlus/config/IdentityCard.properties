# IdentityCard.properties - IdentityCard sequence generator configuration
# Loaded by com.killcoding.datasource.IdentityCard via -DAPP_IDENTITY_CARD
# (TestAll.bat / TestAll.sh pass <PROJECT_ROOT>/JsPlus/config/IdentityCard.properties
# to the console JVM; an interactive console run can set the same system
# property manually).
# Format aligned with the production reference:
#   - DataSource uses ${JS_PLUS_PATH} and points at the project's own
#     testdb datasource definition file (config/DataSource.properties)
#   - Enable=true activates the sequence generator for the test suite
#   - TableName=identity_card - the identity sequence table in testdb
#   - Timeout is in milliseconds (default 10000)
#   - StepValue=1 advances the sequence by 1 per generateId() step
#     (the STEP_VALUE_LIMITED default is 0 - without this key the sequence
#     never advances and generateId() keeps returning the same value)
Enable=true
TableName=identity_card
Timeout=10000
StepValue=1
DataSource=${JS_PLUS_PATH}/config/DataSource.properties
