# ============================================================================
# JsPlus-Core TestDatasource - dedicated pool configuration for the datasource
# test suite (test/TestDatasource.js run via test/TestDatasource.bat/.sh or
# inside TestAll.bat/.sh with -DAPP_DATASOURCE=<this file>).
# ----------------------------------------------------------------------------
# Values are intentionally SECOND-SCALE so the idle/using/abort/timeout
# behaviour cases (C10-C13) complete in well under a minute instead of
# waiting on production-scale values (12m/25m/30m). MaxPoolSize is lowered to
# 10 so the pool-capacity case (C8: borrow-to-max + overflow rejection) also
# runs fast. The production datasource (config/DataSource.properties) is
# untouched by this file.
# ============================================================================
ThreadName=JsPlus_Core_TestDS
DriverJar=

Driver=org.h2.Driver
Url=jdbc:h2:tcp://localhost:${H2_PORT}/testdb
Username=sample_user
Password=sample_password

TestValidTimeout=2s
RefreshPoolTimer=1s
IdleTimeout=5s
Timeout=8s
TransactionTimeout=8s
LifeCycle=12s
MinPoolSize=1
MaxPoolSize=10
ConnProps=autoReconnect=true
EnableFullStatusLog=false
EnableStatusLog=true
StatusLogFolder=${JS_PLUS_PATH}/../logs/DS-Test/

SqlLogEnable=false
SqlLogFolder=${JS_PLUS_PATH}/../logs/SqlLog/
SqlLogArchiveDays=90
SqlLogParamMaxLength=200
SqlLogMaxFileSize=10mb
SqlLogIgnored=
SqlLogAllowed=
SqlLogOverspend=0s

SqlExecuteIgnored=
SqlExecuteAllowed=
