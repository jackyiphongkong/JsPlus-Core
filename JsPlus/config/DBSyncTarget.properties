# ============================================================================
# JsPlus-Core DBSyncTarget - dedicated H2 FILE database for the dbsync test
# suite (test/TestDBSync.js) - the Target side of Source(testdb)->Target sync.
# ----------------------------------------------------------------------------
# Unlike the TCP server testdb (jdbc:h2:tcp://localhost:3306/testdb), this
# datasource points at an independent on-disk database (Database/dbsync_target)
# so Target writes never touch the shared testdb. The file database is created
# automatically on first connect. Values use the same second-scale pool tuning
# as TestDatasource.properties so the suite runs fast.
# ============================================================================
ThreadName=JsPlus_Core_DBSyncTarget
DriverJar=

Driver=org.h2.Driver
Url=jdbc:h2:file:${JS_PLUS_PATH}/../Database/dbsync_target
Username=sample_user
Password=sample_password

TestValidTimeout=2s
RefreshPoolTimer=1s
IdleTimeout=5s
Timeout=8s
TransactionTimeout=8s
LifeCycle=12s
MinPoolSize=1
MaxPoolSize=10
ConnProps=autoReconnect=true
EnableFullStatusLog=false
EnableStatusLog=true
StatusLogFolder=${JS_PLUS_PATH}/../logs/DS-Target/

SqlLogEnable=false
SqlLogFolder=${JS_PLUS_PATH}/../logs/SqlLog/
SqlLogArchiveDays=90
SqlLogParamMaxLength=200
SqlLogMaxFileSize=10mb
SqlLogIgnored=
SqlLogAllowed=
SqlLogOverspend=0s

SqlExecuteIgnored=
SqlExecuteAllowed=
