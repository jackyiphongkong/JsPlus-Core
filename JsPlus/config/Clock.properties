# JsPlus-Core AppClock - remote clock (app clock) configuration
# ----------------------------------------------------------------------------
# Loaded by com.killcoding.datasource.Clock when the APP_CLOCK system property
# / environment variable points here (TestAll.bat/.sh pass -DAPP_CLOCK=...).
# Enable=true makes Clock load a remote-clock DriverDataSource from
# 'DataSource' and track the time returned by 'GetAppClockSql'.
# The SQL must return a first row with 'app_systime_date' (timestamp/date/long)
# and, optionally, 'app_time_zone'. Without a dedicated app-clock table,
# CURRENT_TIMESTAMP works: Clock then tracks the DB server time (gap-calibrated
# against the local clock). Fallback: when the SQL returns nothing, Clock
# tracks the local system time in DefaultTimeZone; the datasource is still
# exposed via Clock.getDataSource().
# GapCachePeriod: how long the remote-time gap stays cached before the
# background RemoteClockRefresher thread re-fetches it from the database.
# Supports duration formats such as 60s, 5s, 1000ms, 1m. Clock calls read the
# cache only and never block on the database.
GapCachePeriod=30s
Enable=true
DataSource=${JS_PLUS_PATH}/config/DataSource.properties
DefaultTimeZone=GMT+8
GetAppClockSql=SELECT (CURRENT_TIMESTAMP + 10 SECOND) AS app_systime_date, 'GMT+8' AS app_time_zone