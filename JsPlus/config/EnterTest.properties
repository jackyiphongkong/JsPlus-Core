# EnterTest.properties - used ONLY by TestDBSync.js C12 (Enter.start/stop lifecycle).
# EnterTest.properties - 僅供 TestDBSync.js C12（Enter.start/stop 生命週期）使用。
#
# This file doubles as the reference for EVERY hidden config key the dbsync module reads:
# Enter (Reverse), Database (Source/Target.*) and Table (Table.*, including workers).
#   - Duration keys accept unit-suffix values: ms/s/m/h/d/w (e.g. 500ms, 30s, 1h, 1d).
#   - C12 keeps ONLY the Inserter enabled so the lifecycle assertion stays clean:
#     Updater / Deleter / Remover are disabled to avoid propagating changes that would
#     pollute the target row-count assertion (and mask whether stop() really took effect).
#   - Each worker's dedicated behaviour is tested separately in TestDBSync.js C13-C16 with
#     its own instance config (loadCp enables Table.X.Enable per case).
# 本檔同時作為 dbsync 模塊所有隱藏配置鍵的參考：Enter（Reverse）、Database（Source/Target.*）
# 與 Table（Table.*，含各 worker）。
#   - 時長鍵接受單位後綴：ms/s/m/h/d/w（例如 500ms、30s、1h、1d）。
#   - C12 只啟用 Inserter，確保生命週期斷言乾淨：關閉 Updater/Deleter/Remover，
#     避免變更傳播污染 target 行數斷言（也避免掩蓋 stop() 是否真正生效）。
#   - 各 worker 的專門行為由 TestDBSync.js C13-C16 用各自實例配置（loadCp 開關 Table.X.Enable）覆蓋。

# ===== [Enter] DBSync engine =====
# [zh] 雙向同步開關：true 時除 Source->Target 外另跑 Target->Source
# [en] Reverse flag: when true, additionally runs Target->Source sync
Reverse=false

# ===== [Database] Source database facade =====
# [zh] Source 數據源配置文件（相對 JsPlus/config/ 下）| [en] Source datasource config file (relative to JsPlus/config/)
Source.Database.DataSource=DBSyncSource.properties
# [zh] Source 數據庫 schema | [en] Source database schema
Source.Database.Schema=PUBLIC
# [zh] 是否啟用標識符引號包裹（true 用 Quote.Format 格式）| [en] Enable identifier quoting (Quote.Format applies when true)
Source.Database.Quote.Enable=false
# [zh] 引號格式模板，%s 為標識符佔位 | [en] Quote format template, %s is the identifier placeholder
Source.Database.Quote.Format=%s
# [zh] 引號後是否轉大寫（配合部分數據庫大寫存儲）| [en] Uppercase identifier after quoting (for upper-casing databases)
Source.Database.Quote.ToUpperCase=false
# [zh] 連接池使用率上限（0 表示不限制；達到後該庫暫停建立新連接）| [en] Max connection-pool usage (0 = unlimited; new connections are paused at the limit)
Source.Database.MaxUsage=0

# ===== [Database] Target database facade =====
# [zh] Target 數據源配置文件（相對 JsPlus/config/ 下）| [en] Target datasource config file (relative to JsPlus/config/)
Target.Database.DataSource=DBSyncTarget.properties
# [zh] Target 數據庫 schema | [en] Target database schema
Target.Database.Schema=PUBLIC
# [zh] 是否啟用標識符引號包裹 | [en] Enable identifier quoting
Target.Database.Quote.Enable=false
# [zh] 引號格式模板，%s 為標識符佔位 | [en] Quote format template, %s is the identifier placeholder
Target.Database.Quote.Format=%s
# [zh] 引號後是否轉大寫 | [en] Uppercase identifier after quoting
Target.Database.Quote.ToUpperCase=false
# [zh] 連接池使用率上限（0 表示不限制）| [en] Max connection-pool usage (0 = unlimited)
Target.Database.MaxUsage=0

# ===== [Table] Common =====
# [zh] 同步表清單（逗號分隔的表名列表；與 GetTables.Sql 二選一，List 優先）| [en] Tables to sync (comma-separated; alternative to GetTables.Sql, List wins)
Table.GetTables.List=dbsync_ent_a
# [zh] 動態查詢表清單的 SQL（返回 table_name 列；List 為空時才使用）| [en] SQL that returns the table list (column table_name; used only when List is blank)
Table.GetTables.Sql=
# [zh] 每個 worker 輪詢間隔 | [en] Worker poll interval per loop round
Table.Timer=200ms
# [zh] worker 啟動延遲 | [en] Worker start delay
Table.DelayStart=1000ms
# [zh] 任務批次提交間延遲 | [en] Delay between task batch submissions
Table.DelayTask=1000ms
# [zh] 單次 find 掃描最大行數 | [en] Max rows scanned per find
Table.MaxRows=10000
# [zh] 單次批量執行（batch sql）每批行數 | [en] Rows per batch execution (batch sql)
Table.Batch=100
# [zh] 同步忽略窗口：最新 IgnoredPeriod 內的記錄不參與同步（避免與寫入方競態）| [en] Ignored trailing window: records newer than this are not synced (avoids writer race)
Table.IgnoredPeriod=0

# ===== [Table] Table log (heartbeat / batch audit) =====
# [zh] 是否啟用表同步日誌 | [en] Enable per-table sync log
Table.TableLog.Enable=false
# [zh] 表同步日誌目錄（默認 JsPlus/TableLogs/<pid>）| [en] Table log folder (default JsPlus/TableLogs/<pid>)
Table.TableLog.Folder=
# [zh] 是否啟用心跳寫入 Heartbeat.log | [en] Enable heartbeat writes to Heartbeat.log
Table.TableLog.Heartbeat=false
# [zh] 表同步日誌歸檔天數 | [en] Table log archive days
Table.TableLog.ArchiveDays=31

# ===== [Table] Keys =====
# [zh] 主鍵列名 | [en] Primary key column
Table.PrimaryKey=id
# [zh] Inserter 增量鍵（新記錄判定時間戳列）| [en] Inserter incremental key (created timestamp column)
Table.Inserter.Key=created_at
# [zh] Updater 增量鍵（更新判定時間戳列）| [en] Updater incremental key (updated timestamp column)
Table.Updater.Key=updated_at
# [zh] Deleter 增量鍵（刪除判定時間戳列）| [en] Deleter incremental key (deleted timestamp column)
Table.Deleter.Key=deleted_at
# [zh] Deleter 軟刪除標誌列（=1 表示已刪除）| [en] Deleter soft-delete flag column (=1 means deleted)
Table.Deleter.DeletedKey=deleted
# [zh] Remover 過期判定時間戳列（默認 deleted_at）| [en] Remover expiry timestamp column (default deleted_at)
Table.Remover.Key=deleted_at

# ===== [Table] Inserter worker =====
# [zh] Inserter 是否啟用（C12 生命週期斷言僅啟用此項）| [en] Enable Inserter worker (C12 lifecycle assertion relies on it being the only one)
Table.Inserter.Enable=true
# [zh] Inserter 掃描窗口（每輪向前推進的時長跨度）| [en] Inserter scan window (time span advanced per round)
Table.Inserter.Period=24h
# [zh] Inserter 批次窗口（單次 executeTask 處理的時長跨度）| [en] Inserter batch window (time span per executeTask)
Table.Inserter.Window=1h

# ===== [Table] Updater worker =====
# [zh] Updater 是否啟用（C12 保持關閉，C14 用 loadCp 開啟）| [en] Enable Updater worker (off in C12, enabled via loadCp in C14)
Table.Updater.Enable=false
# [zh] Updater 掃描窗口 | [en] Updater scan window
Table.Updater.Period=24h
# [zh] Updater 批次窗口 | [en] Updater batch window
Table.Updater.Window=1h

# ===== [Table] Deleter worker =====
# [zh] Deleter 是否啟用（C12 保持關閉，C15 用 loadCp 開啟）| [en] Enable Deleter worker (off in C12, enabled via loadCp in C15)
Table.Deleter.Enable=false
# [zh] Deleter 掃描窗口 | [en] Deleter scan window
Table.Deleter.Period=24h
# [zh] Deleter 批次窗口 | [en] Deleter batch window
Table.Deleter.Window=1h

# ===== [Table] Remover worker =====
# [zh] Remover 是否啟用（C12 保持關閉，C17 用 loadCp 開啟）| [en] Enable Remover worker (off in C12, enabled via loadCp in C17)
Table.Remover.Enable=false
# [zh] Remover 過期閾值：早於此時長的軟刪除行被物理刪除 | [en] Remover expiry threshold: soft-deleted rows older than this are physically deleted
Table.Remover.Before=24h
# [zh] Remover 清理輪詢間隔 | [en] Remover cleanup poll interval
Table.Remover.Timer=10s
