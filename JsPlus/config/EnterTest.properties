# EnterTest.properties - used ONLY by TestDBSync.js C12 (Enter.start/stop lifecycle).
#
# This file doubles as the reference for EVERY hidden config key the dbsync module reads:
# Enter (Reverse), Database (Source/Target.*) and Table (Table.*, including workers).
#   - Duration keys accept unit-suffix values: ms/s/m/h/d/w (e.g. 500ms, 30s, 1h, 1d).
#   - C12 keeps ONLY the Inserter enabled so the lifecycle assertion stays clean:
#     Updater / Deleter / Remover are disabled to avoid propagating changes that would
#     pollute the target row-count assertion (and mask whether stop() really took effect).
#   - Each worker's dedicated behaviour is tested separately in TestDBSync.js C13-C16 with
#     its own instance config (loadCp enables Table.X.Enable per case).

# ===== [Enter] DBSync engine =====
# Reverse flag: when true, additionally runs Target->Source sync
Reverse=false

# ===== [Database] Source database facade =====
# Source datasource config file (relative to JsPlus/config/)
Source.Database.DataSource=DBSyncSource.properties
# Source database schema
Source.Database.Schema=PUBLIC
# Enable identifier quoting (Quote.Format applies when true)
Source.Database.Quote.Enable=false
# Quote format template, %s is the identifier placeholder
Source.Database.Quote.Format=%s
# Uppercase identifier after quoting (for upper-casing databases)
Source.Database.Quote.ToUpperCase=false
# Max connection-pool usage (0 = unlimited; new connections are paused at the limit)
Source.Database.MaxUsage=0

# ===== [Database] Target database facade =====
# Target datasource config file (relative to JsPlus/config/)
Target.Database.DataSource=DBSyncTarget.properties
# Target database schema
Target.Database.Schema=PUBLIC
# Enable identifier quoting
Target.Database.Quote.Enable=false
# Quote format template, %s is the identifier placeholder
Target.Database.Quote.Format=%s
# Uppercase identifier after quoting
Target.Database.Quote.ToUpperCase=false
# Max connection-pool usage (0 = unlimited)
Target.Database.MaxUsage=0

# ===== [Table] Common =====
# Tables to sync (comma-separated; alternative to GetTables.Sql, List wins)
Table.GetTables.List=dbsync_ent_a
# SQL that returns the table list (column table_name; used only when List is blank)
Table.GetTables.Sql=
# Worker poll interval per loop round
Table.Timer=200ms
# Worker start delay
Table.DelayStart=1000ms
# Delay between task batch submissions
Table.DelayTask=1000ms
# Max rows scanned per find
Table.MaxRows=10000
# Rows per batch execution (batch sql)
Table.Batch=100
# Ignored trailing window: records newer than this are not synced (avoids writer race)
Table.IgnoredPeriod=0ms

# ===== [Table] Table log (heartbeat / batch audit) =====
# Enable per-table sync log
Table.TableLog.Enable=false
# Table log folder (default JsPlus/TableLogs/<pid>)
Table.TableLog.Folder=
# Enable heartbeat writes to Heartbeat.log
Table.TableLog.Heartbeat=false
# Table log archive days
Table.TableLog.ArchiveDays=31

# ===== [Table] Keys =====
# Primary key column
Table.PrimaryKey=id
# Inserter incremental key (created timestamp column)
Table.Inserter.Key=created_at
# Updater incremental key (updated timestamp column)
Table.Updater.Key=updated_at
# Deleter incremental key (deleted timestamp column)
Table.Deleter.Key=deleted_at
# Deleter soft-delete flag column (=1 means deleted)
Table.Deleter.DeletedKey=deleted
# Remover expiry timestamp column (default deleted_at)
Table.Remover.Key=deleted_at

# ===== [Table] Inserter worker =====
# Enable Inserter worker (C12 lifecycle assertion relies on it being the only one)
Table.Inserter.Enable=true
# Inserter scan window (time span advanced per round)
Table.Inserter.Period=24h
# Inserter batch window (time span per executeTask)
Table.Inserter.Window=1h

# ===== [Table] Updater worker =====
# Enable Updater worker (off in C12, enabled via loadCp in C14)
Table.Updater.Enable=false
# Updater scan window
Table.Updater.Period=24h
# Updater batch window
Table.Updater.Window=1h

# ===== [Table] Deleter worker =====
# Enable Deleter worker (off in C12, enabled via loadCp in C15)
Table.Deleter.Enable=false
# Deleter scan window
Table.Deleter.Period=24h
# Deleter batch window
Table.Deleter.Window=1h

# ===== [Table] Remover worker =====
# Enable Remover worker (off in C12, enabled via loadCp in C17)
Table.Remover.Enable=false
# Remover expiry threshold: soft-deleted rows older than this are physically deleted
Table.Remover.Before=24h
# Remover cleanup poll interval
Table.Remover.Timer=10s
