name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  automated-tests:
    name: Automated Tests (TestAll)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '25'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Build jsplus-core.jar
        run: ant build

      - name: Verify jar version matches version.properties
        run: |
          MAJOR=$(grep '^jr.major=' version.properties | cut -d= -f2)
          MINOR=$(grep '^jr.minor=' version.properties | cut -d= -f2)
          PATCH=$(grep '^jr.patch=' version.properties | cut -d= -f2)
          JAR="LibHome/jsplus/default/jsplus-core-${MAJOR}.${MINOR}.${PATCH}.jar"
          if [ ! -s "$JAR" ]; then
            echo "ERROR: expected JAR not found or empty: $JAR"
            exit 1
          fi
          echo "Verified JAR: $JAR (matches version.properties ${MAJOR}.${MINOR}.${PATCH})"

      - name: Run TestAll.sh
        run: |
          # Restore executable bits lost by the Git checkout (mode 644) on
          # every helper script under JsPlus/bin, then run the suite entry.
          # working-directory is test/, so ../JsPlus points at <repo>/JsPlus.
          chmod +x TestAll.sh ../JsPlus/bin/*.sh
          ./TestAll.sh
        working-directory: test

      - name: Publish CI summary
        run: |
          if [ -f docs/latest/report/TestAll-CI-Summary.md ]; then
            cat docs/latest/report/TestAll-CI-Summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build artifacts and test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            docs/latest/report/
            logs/
            LibHome/jsplus/default/*.jar
            docs/apis/*.jar
            docs/latest/api/
          if-no-files-found: error
