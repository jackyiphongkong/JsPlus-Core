# ============================================================================
# JsPlus-Core DBSyncSource - dedicated H2 FILE database for the dbsync test
# suite (test/TestDBSync.js) - the SOURCE side of Source->Target sync.
# ----------------------------------------------------------------------------
# Mirrors DBSyncTarget.properties: an independent on-disk database
# (Database/dbsync_source) so Source writes never touch the shared testdb.
# Schema is initialized by InitDBSyncDB (dbscript/fallback_sync.sql ->
# change_sync.sql). Values use the same second-scale pool tuning as
# TestDatasource.properties so the suite runs fast.
# ============================================================================
ThreadName=JsPlus_Core_DBSyncSource
DriverJar=

Driver=org.h2.Driver
Url=jdbc:h2:file:${JS_PLUS_PATH}/../Database/dbsync_source
Username=sample_user
Password=sample_password

TestValidTimeout=2s
RefreshPoolTimer=1s
IdleTimeout=5s
Timeout=8s
TransactionTimeout=8s
LifeCycle=12s
MinPoolSize=1
MaxPoolSize=10
ConnProps=autoReconnect=true
EnableFullStatusLog=false
EnableStatusLog=true
StatusLogFolder=${JS_PLUS_PATH}/../logs/DS-Source/

SqlLogEnable=false
SqlLogFolder=${JS_PLUS_PATH}/../logs/SqlLog/
SqlLogArchiveDays=90
SqlLogParamMaxLength=200
SqlLogMaxFileSize=10mb
SqlLogIgnored=
SqlLogAllowed=
SqlLogOverspend=0s

SqlExecuteIgnored=
SqlExecuteAllowed=
