name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  automated-tests:
    name: Automated Tests (TestDatasource)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '25'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Build jsplus-core.jar
        run: ant build

      - name: Verify jar version matches version.properties
        run: |
          MAJOR=$(grep '^jr.major=' version.properties | cut -d= -f2)
          MINOR=$(grep '^jr.minor=' version.properties | cut -d= -f2)
          PATCH=$(grep '^jr.patch=' version.properties | cut -d= -f2)
          JAR="LibHome/jsplus/default/jsplus-core-${MAJOR}.${MINOR}.${PATCH}.jar"
          if [ ! -s "$JAR" ]; then
            echo "ERROR: expected JAR not found or empty: $JAR"
            exit 1
          fi
          echo "Verified JAR: $JAR (matches version.properties ${MAJOR}.${MINOR}.${PATCH})"

      - name: Run TestDatasource.sh
        run: |
          # Debug isolation (2026-10-29): CI runs ONLY the TestDatasource
          # pool suite for now. Its standalone flow (StopAll sweep -> own H2
          # start on :3306 -> TestDatasource.js) verifies the suite's own H2
          # lifecycle on a clean runner, without the TestAll.sh shared-H2
          # handover that has been failing on :3306 (runs #43/#44/#45).
          chmod +x TestDatasource.sh ../JsPlus/bin/*.sh
          ./TestDatasource.sh graalvm.js
        working-directory: test

      - name: Publish CI summary
        if: always()
        run: |
          if [ -f docs/latest/report/TestDatasource-Report.md ]; then
            head -n 40 docs/latest/report/TestDatasource-Report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Upload artifacts even when TestAll fails (exit 1): without
      # "if: always()" GitHub skips this step on failure and the
      # test-reports zip (reports + logs + jars) is never produced, making
      # CI failures hard to diagnose. warn (not error) so a partially
      # missing file set still uploads what exists.
      - name: Upload build artifacts and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            docs/latest/report/
            logs/
            LibHome/jsplus/default/*.jar
            docs/apis/*.jar
            docs/latest/api/
          if-no-files-found: warn
