# ============================================================================
# JsPlus-Core Logger configuration (read by Logger / LogRecord)
# Encoding: UTF-8 (ConfigProperties reads with BaseFile.CHARSET)
# Below is the full list: active config + hidden optional config.
# Hidden items are listed as comments - Logger already supports them with
# the documented defaults; uncomment to enable (key must not contain spaces).
# ============================================================================

# --- Basic ---
# Log level: DEBUG / INFO / WARN / ERROR / MARK (code default: DEBUG)
Level=INFO

# System name: written into the log record's system_name field (report/archive id)
SystemName=Core

# --- Output scheduling ---
# Log batch output timer: flush buffered batch at this interval (code default: 1000ms)
OutLogTimer=5s

# Max log lines per batch: flush immediately when buffer reaches this (code default: 1000)
OutLogBatchLimit=100000

# --- Console output ---
# Whether to also write to stdout (code default: true)
SystemOut=true

# --- File output ---
# Whether to write log files (code default: false)
FileOut=true

# Max single log file size: rotate/backup when exceeded (code default: 10mb)
FileOutMaxFileSize=5mb

# Max backup files kept after rotation (code default: 10)
FileOutMaxBackupIndex=1000

# Archive retention days: backup files older than this are deleted (code default: 30)
FileOutArchiveDays=30

# Log file name format: content inside ` is the SimpleDateFormat pattern (code default: `yyyyMMdd`.log)
FileNameFormat=`yyyyMMdd`.log

# Log output folder: supports ${JS_PLUS_PATH} placeholder (code default: null -> no file output)
FileOutFolder=${JS_PLUS_PATH}/../logs/app/

# --- Alert ---
# Alert handler class name: AlertMessage implementation (blank = alerts disabled)
AlertMessage.class=

# --- Log line format ---
# Single-line output format (placeholders: :level / :log_time_format / :hostname /
# :log_thread_name / :log_thread_id / :log_class_name / :log_method_name /
# :log_file_name / :log_line_number / :message / :stack_trace)
# (code default: :level :log_time_format [:log_thread_name-:log_thread_id]
#   :log_class_name.:log_method_name(:log_file_name::log_line_number)
#   **:message** \r\n:stack_trace)
MessageFormat=:level :log_time_format [:hostname-:log_thread_name-:log_thread_id] :log_class_name **:message** \r\n:stack_trace

# ============================================================================
# Hidden optional config (supported by Logger but not listed in the default file)
# Uncomment to enable; defaults apply when omitted
# ============================================================================

# Log time format (time-of-day part; code default: yyyyMMdd HH:mm:ss.SSS)
#LogTimeFormat=yyyyMMdd HH:mm:ss.SSS

# Log date format (date part; code default: yyyyMMdd)
#LogDateFormat=yyyyMMdd

# Class-name allowlist regex: only log records whose class name matches (blank = log all)
#ClassNameEnableRegex=

# Class-name denylist regex: skip log records whose class name matches (blank = no filter)
#ClassNameDisableRegex=

# Log file header: header text written into a new file on rotation/archive
#MessageHeader=

# Alert trigger levels: comma-separated; alert fires when the level matches (code default: DEBUG,INFO,WARN,ERROR,MARK)
#AlertMessage.level=DEBUG,INFO,WARN,ERROR,MARK

# --- Database output (DatabaseOut) ---
# Whether to write logs into a database (code default: false)
#DatabaseOut=false

# Remote-config refresh timer: poll interval for DatabaseOutConfigFrom in ms (code default: 60000)
#DatabaseOutRefreshConfigTimer=60000

# Database output datasource: target datasource name (code default: "")
#DatabaseOutDataSource=

# Archive executor: SQL/command name that archives log records
#DatabaseOutArchiveExecute=

# Archive throttle: minimum interval between archive scans in ms (code default: 60000);
# the archive execute runs at most once per interval even though the flush loop runs every OutLogTimer
#DatabaseOutArchiveTimer=60000

# Datasource retry back-off: skip reconnect attempts within this ms after a failed init
# (code default: 30000); prevents per-second connect attempts when the DB is offline
#DatabaseOutRetryTimer=30000

# Insert executor: SQL/command name that writes log records
#DatabaseOutInsertExecute=

# Remote-config source: read remote config from DB to override local settings
# (supports keys: level / class_name_enable_regex / class_name_disable_regex)
#DatabaseOutConfigFrom=

# Database output batch limit (code default: 100)
#DatabaseOutBatchLimit=100

# Database archive retention days (code default: 31)
#DatabaseOutArchiveDays=31
