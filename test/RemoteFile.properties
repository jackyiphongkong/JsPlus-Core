# RemoteFile.properties - RemoteFile datasource configuration
# Loaded by com.killcoding.file.RemoteFile via -DAPP_REMOTE_FILE
# (TestAll.bat / TestAll.sh pass <PROJECT_ROOT>/test/RemoteFile.properties
# to the console JVM; an interactive console run can set the same system
# property manually).
# Format aligned with the production RemoteFile.properties reference:
#   - DataSource / DataMapping[0].DataSource use ${JS_PLUS_PATH} variables
#     and point at the project's own testdb datasource definition file
#   - EncryptEnable=true + EncryptAesKey (same mechanism as production;
#     the suite verifies the encrypted write / decrypted read roundtrip)
#   - DataMapping[0].TableRange=0-1 keeps the data tables to just
#     remote_file_data_0 / remote_file_data_1 (production uses 0-1023)
#   - FilePartSize=1kb (production 1mb) so append tests split parts cheaply
#   - IdentityCardEnable=false for the suite (production true; id generation
#     then uses CommonTools.generateId(16) instead of an IdentityCard table)
#   - SyncCutoffTime/DeleteCutoffTime use ConfigProperties' DATETIME_PATTERN
#     (yyyy.MM.dd HH:mm:ss[.SSSSSSSSS]): the RemoteFile default
#     '0000-01-01 00:00:00.0000' does NOT match that pattern (dash vs dot
#     separator), so reload() fails before the datasources initialize unless
#     the keys are provided in the correct format.
DataSource=${JS_PLUS_PATH}/config/DataSource.properties
EncryptEnable=true
EncryptAesKey=Dfkmoc%396H{f_)!@jodfkf#
LogCompletedStatus=true
FilePartSize=1kb
TableName=remote_file
IdentityCardEnable=false
MaxFileSize=1mb
LogicTimeout=300s
ShowHidden=false
ShowLink=false
MaxQueueSize=10
MaxDeleteQueueSize=5
BatchSize=10
MaxConnectUsage=0.6
CheckHaveParent=false
CacheSeconds=0
SyncCutoffTime=2024.01.01 00:00:00
DeleteCutoffTime=2024.01.01 00:00:00
DataMapping[0]=DataMappingDs_0
DataMapping[0].DataSource=${JS_PLUS_PATH}/config/DataSource.properties
DataMapping[0].Priority=1
DataMapping[0].TableRange=0-1

